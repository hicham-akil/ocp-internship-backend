spring.application.name=${SPRING_APPLICATION_NAME}

# ==========================================
# Configuration MySQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW}
spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL}

# ==========================================
# Server
# ==========================================
server.port=${SERVER_PORT}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}

# ==========================================
# Jackson
# ==========================================
spring.jackson.date-format=${SPRING_JACKSON_DATE_FORMAT}
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}

# ==========================================
# Logging
# ==========================================
logging.level.org.example.project_stage_backend=${LOGGING_LEVEL_ORG_EXAMPLE_PROJECT_STAGE_BACKEND}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL}

# ==========================================
# External Services
# ==========================================
n8n.webhook.url=${N8N_WEBHOOK_URL}
ml.service.url=${ML_SERVICE_URL}

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}